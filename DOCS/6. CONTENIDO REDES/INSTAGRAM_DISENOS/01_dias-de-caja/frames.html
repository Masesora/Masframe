<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Analítica del domingo Nº 1 · Días de caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1A35; --navy2:#1E3060; --gold:#B89D52; --gold2:#D4B96A; --cream:#FAF7F2;
  --ok:#2E7D4F; --warn:#C69749; --crit:#B8471F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05080f;font-family:'Montserrat',system-ui,sans-serif;color:#fff}

/* Cada fotograma: 1080x1920. Zona segura de Instagram: y 250 a 1500 */
.frame{
  width:1080px;height:1920px;position:relative;overflow:hidden;
  background:
    radial-gradient(900px 700px at 100% 0%, rgba(30,48,96,.95), transparent 70%),
    radial-gradient(700px 600px at 0% 100%, rgba(30,48,96,.7), transparent 70%),
    var(--navy);
}
.frame::after{ /* trama fina de monitor */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(rgba(184,157,82,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(184,157,82,.9) 1px,transparent 1px);
  background-size:60px 60px;
}
.safe{position:absolute;left:90px;right:90px;top:250px;bottom:420px;z-index:2;display:flex;flex-direction:column}

.tag{display:flex;align-items:center;gap:18px;margin-bottom:56px}
.tag .pill{background:var(--gold);color:var(--navy);font-weight:800;font-size:26px;letter-spacing:.14em;padding:12px 22px;border-radius:999px}
.tag .txt{font-weight:600;font-size:26px;letter-spacing:.22em;color:var(--gold2);text-transform:uppercase}

.eyebrow{font-weight:600;font-size:30px;letter-spacing:.26em;color:var(--gold2);text-transform:uppercase;margin-bottom:26px}
h1,h2{font-weight:800;line-height:1.1;letter-spacing:-.01em}
.gold{color:var(--gold2)}
.muted{color:rgba(255,255,255,.72)}

.brand{position:absolute;left:90px;right:90px;bottom:430px;z-index:2;display:flex;align-items:center;justify-content:space-between}
.brand .wm{font-weight:800;letter-spacing:.12em;font-size:34px}
.brand .wm small{display:block;font-weight:500;font-size:13px;letter-spacing:.42em;color:var(--gold);margin-top:6px}
.brand .hd{font-weight:500;font-size:28px;color:rgba(255,255,255,.7);letter-spacing:.04em}

.ecg{position:absolute;left:0;right:0;z-index:1}
.ecg svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(212,185,106,.55))}

/* 1 · Gancho */
.f1 h1{font-size:104px}
.f1 .ecg{bottom:560px}

/* 2 · Fórmula */
.f2 h2.big{font-size:124px;color:var(--gold2);margin-bottom:46px;white-space:nowrap}
.formula{border:3px solid var(--gold);background:rgba(255,255,255,.05);border-radius:28px;padding:56px 50px;text-align:center}
.formula .eq{font-weight:700;font-size:70px;line-height:1.25}
.formula .eq b{color:var(--gold2)}
.notes{margin-top:44px;display:flex;flex-direction:column;gap:20px;font-size:34px;line-height:1.35;color:rgba(255,255,255,.85)}
.notes div{padding-left:26px;border-left:5px solid var(--gold)}
.cta-line{margin-top:70px;font-weight:700;font-size:48px;color:var(--gold2)}

/* 3 · Umbrales */
.f3 h2{font-size:84px;margin-bottom:54px}
.band{border-radius:26px;padding:36px 42px;margin-bottom:26px;display:flex;flex-direction:column;gap:8px}
.band .k{font-weight:800;font-size:58px}
.band .v{font-weight:500;font-size:36px;line-height:1.3}
.band.r{background:var(--crit)}
.band.a{background:rgba(198,151,73,.22);border:3px solid var(--warn)}
.band.g{background:var(--ok)}

/* 4 · Caso tipo */
.chip{display:inline-block;align-self:flex-start;border:2px solid var(--gold);color:var(--gold2);font-weight:700;font-size:28px;letter-spacing:.14em;padding:12px 24px;border-radius:999px;text-transform:uppercase;margin-bottom:30px}
.f4 h2{font-size:78px;margin-bottom:40px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{border-radius:26px;padding:40px 34px;background:rgba(255,255,255,.06);border-top:12px solid var(--crit)}
.card.after{border-top-color:var(--ok);background:rgba(46,125,79,.18)}
.card .lab{font-weight:700;font-size:26px;letter-spacing:.2em;color:rgba(255,255,255,.65);text-transform:uppercase}
.card .num{font-weight:800;font-size:128px;line-height:1;margin:18px 0 6px}
.card .unit{font-weight:600;font-size:38px;color:var(--gold2)}
.card .sub{margin-top:22px;font-size:30px;line-height:1.35;color:rgba(255,255,255,.82)}
.arrowline{margin:40px 0 0;font-size:40px;line-height:1.4;color:rgba(255,255,255,.88);border-left:6px solid var(--gold);padding-left:28px}

/* 5 · Diagnóstico */
.f5 .dx{font-size:128px;margin:6px 0 26px}
.f5 .esp{font-weight:700;font-size:44px;letter-spacing:.14em;color:var(--gold2);text-transform:uppercase;margin-bottom:64px}
.quote{font-size:56px;line-height:1.28;font-weight:600;border-left:8px solid var(--gold);padding-left:36px}
.quote em{font-style:normal;color:var(--gold2)}

/* 6 · Cierre */
.f6 h2{font-size:92px;margin-bottom:26px}
.f6 .sub{font-size:40px;color:rgba(255,255,255,.8);margin-bottom:56px}
.step{display:flex;align-items:center;gap:30px;background:rgba(255,255,255,.06);border:2px solid rgba(184,157,82,.5);border-radius:26px;padding:30px 36px;margin-bottom:22px}
.step .n{flex:0 0 auto;width:78px;height:78px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:44px;display:flex;align-items:center;justify-content:center}
.step .t{font-weight:700;font-size:40px;line-height:1.2}
.step .t span{display:block;font-weight:500;font-size:30px;color:rgba(255,255,255,.75);margin-top:6px}
.go{margin-top:30px;text-align:center;background:var(--gold);color:var(--navy);font-weight:800;font-size:46px;border-radius:999px;padding:30px}

/* 7 · Portada */
.f7 .safe{justify-content:center}
.f7 .q{font-size:96px;margin-bottom:34px}
.f7 .num{font-weight:800;font-size:330px;line-height:.9;color:var(--gold2)}
.f7 .num small{font-size:84px;font-weight:700;color:#fff;margin-left:14px}
.f7 .ecg{bottom:520px}

/* Galería de revisión */
.sheet{display:flex;flex-wrap:wrap;gap:24px;padding:24px;background:#05080f}
.sheet .slot{width:324px;height:576px;position:relative;overflow:hidden;border-radius:10px}
.sheet .slot .frame{transform:scale(.3);transform-origin:top left}
.sheet .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);font-size:13px;padding:6px 10px}
.single .sheet,.single{padding:0;margin:0;display:block}
</style>
</head>
<body>
<div id="root"></div>

<template id="frames">
<!-- 1 · GANCHO -->
<div class="frame f1" data-n="1" data-name="01_gancho">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <h1>¿Cuántos días aguanta tu negocio si mañana no entra <span class="gold">ni un euro</span>?</h1>
  </div>
  <div class="ecg"><svg viewBox="0 0 1080 200" fill="none" stroke="#D4B96A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M0,100 L170,100 L210,100 L250,30 L290,170 L330,100 L470,100 L505,100 L540,50 L575,150 L610,100 L720,100 L1080,100"/></svg></div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 2 · FÓRMULA -->
<div class="frame f2" data-n="2" data-name="02_formula">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <div class="eyebrow">Tu constante vital</div>
    <h2 class="big">Días de caja</h2>
    <div class="formula"><div class="eq">(<b>saldo</b> ÷ <b>gastos fijos</b> del mes) × 30</div></div>
    <div class="notes">
      <div><b>Saldo:</b> lo que hay en tu cuenta ahora mismo.</div>
      <div><b>Gastos fijos:</b> tu media mensual de los últimos 3 meses.</div>
    </div>
    <div class="cta-line">Haz la cuenta ahora.</div>
  </div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 3 · UMBRALES -->
<div class="frame f3" data-n="3" data-name="03_umbrales">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <h2>¿Dónde está tu número?</h2>
    <div class="band r"><div class="k">Menos de 30 días</div><div class="v">Vendes por urgencia, no por estrategia.</div></div>
    <div class="band a"><div class="k">De 30 a 60 días</div><div class="v">Zona intermedia.</div></div>
    <div class="band g"><div class="k">Más de 60 días</div><div class="v">Tienes el control total de tu caja.</div></div>
  </div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 4 · CASO TIPO -->
<div class="frame f4" data-n="4" data-name="04_caso-tipo">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <span class="chip">Caso tipo · Taller mecánico</span>
    <h2>8.500 € en cuenta y 8.000 € de gastos fijos al mes.</h2>
    <div class="duo">
      <div class="card"><div class="lab">Antes</div><div class="num">31</div><div class="unit">días de caja</div></div>
      <div class="card after"><div class="lab">Después</div><div class="num">60</div><div class="unit">días de caja</div></div>
    </div>
    <div class="arrowline">Liberó <b class="gold">7.500 €</b> atrapados en stock y facturas pendientes de cobro.</div>
  </div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 5 · DIAGNÓSTICO -->
<div class="frame f5" data-n="5" data-name="05_diagnostico">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <div class="eyebrow">Diagnóstico</div>
    <h2 class="dx">Obstrucción de caja</h2>
    <div class="esp">UCI Financiera</div>
    <div class="quote">No es que no entre dinero.<br><em>Es que no sale lo que ya ganaste.</em></div>
  </div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 6 · CIERRE -->
<div class="frame f6" data-n="6" data-name="06_cierre">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <h2>Escáner de Salud Empresarial</h2>
    <div class="sub">Gratis · 10 minutos</div>
    <div class="step"><div class="n">1</div><div class="t">Haces el Escáner<span>10 especialidades</span></div></div>
    <div class="step"><div class="n">2</div><div class="t">Recibes tu informe<span>con los síntomas detectados</span></div></div>
    <div class="step"><div class="n">3</div><div class="t">Tu código de acceso<span>a La Clínica de Empresas</span></div></div>
    <div class="go">Enlace en la biografía</div>
  </div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 7 · PORTADA (cuadrícula del perfil) -->
<div class="frame f7" data-n="7" data-name="07_portada">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 1</span><span class="txt">Analítica del domingo</span></div>
    <h1 class="q">¿Cuántos días de caja tiene tu negocio?</h1>
    <div class="num">30<small>días</small></div>
  </div>
  <div class="ecg"><svg viewBox="0 0 1080 200" fill="none" stroke="#D4B96A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M0,100 L170,100 L210,100 L250,30 L290,170 L330,100 L470,100 L505,100 L540,50 L575,150 L610,100 L720,100 L1080,100"/></svg></div>
</div>
</template>

<script>
(function(){
  var tpl=document.getElementById('frames').content;
  var root=document.getElementById('root');
  var q=new URLSearchParams(location.search);
  var only=q.get('f');
  var frames=Array.prototype.slice.call(tpl.querySelectorAll('.frame'));
  if(only){
    document.body.classList.add('single');
    var el=frames.filter(function(f){return f.getAttribute('data-n')===only})[0];
    root.appendChild(el);
  } else {
    var sheet=document.createElement('div');sheet.className='sheet';
    frames.forEach(function(f){
      var slot=document.createElement('div');slot.className='slot';
      slot.appendChild(f);
      var cap=document.createElement('div');cap.className='cap';cap.textContent=f.getAttribute('data-name');
      slot.appendChild(cap);sheet.appendChild(slot);
    });
    root.appendChild(sheet);
  }
})();
</script>
</body>
</html>
