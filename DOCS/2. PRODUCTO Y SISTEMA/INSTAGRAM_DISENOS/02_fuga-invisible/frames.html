<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Analítica del domingo Nº 2 · Fuga invisible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1A35; --navy2:#1E3060; --gold:#B89D52; --gold2:#D4B96A; --cream:#FAF7F2;
  --ok:#2E7D4F; --warn:#C69749; --crit:#B8471F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05080f;font-family:'Montserrat',system-ui,sans-serif;color:#fff}

/* Carrusel 4:5 · 1080x1350 */
.frame{
  width:1080px;height:1350px;position:relative;overflow:hidden;
  background:
    radial-gradient(900px 700px at 100% 0%, rgba(30,48,96,.95), transparent 70%),
    radial-gradient(700px 600px at 0% 100%, rgba(30,48,96,.7), transparent 70%),
    var(--navy);
}
.frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(rgba(184,157,82,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(184,157,82,.9) 1px,transparent 1px);
  background-size:60px 60px;
}
.safe{position:absolute;left:90px;right:90px;top:90px;bottom:190px;z-index:2;display:flex;flex-direction:column}

.tag{display:flex;align-items:center;gap:18px;margin-bottom:50px}
.tag .pill{background:var(--gold);color:var(--navy);font-weight:800;font-size:26px;letter-spacing:.14em;padding:12px 22px;border-radius:999px}
.tag .txt{font-weight:600;font-size:26px;letter-spacing:.22em;color:var(--gold2);text-transform:uppercase}
.tag .cnt{margin-left:auto;font-weight:700;font-size:28px;letter-spacing:.1em;color:rgba(255,255,255,.6)}

.eyebrow{font-weight:600;font-size:30px;letter-spacing:.26em;color:var(--gold2);text-transform:uppercase;margin-bottom:24px}
h1,h2{font-weight:800;line-height:1.1;letter-spacing:-.01em}
.gold{color:var(--gold2)}

.brand{position:absolute;left:90px;right:90px;bottom:70px;z-index:2;display:flex;align-items:center;justify-content:space-between}
.brand .wm{font-weight:800;letter-spacing:.12em;font-size:34px}
.brand .wm small{display:block;font-weight:500;font-size:13px;letter-spacing:.42em;color:var(--gold);margin-top:6px}
.brand .hd{font-weight:500;font-size:28px;color:rgba(255,255,255,.7);letter-spacing:.04em}
.swipe{position:absolute;right:90px;bottom:140px;z-index:2;font-weight:700;font-size:26px;letter-spacing:.2em;color:var(--gold2);text-transform:uppercase}

.ecg{position:absolute;left:0;right:0;z-index:1}
.ecg svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(212,185,106,.55))}

/* 1 · Portada */
.s1 h1{font-size:112px;margin-top:20px}
.s1 .ecg{bottom:250px}

/* 2 · La constante */
.s2 h2{font-size:78px;margin-bottom:46px}
.frac{border:3px solid var(--gold);background:rgba(255,255,255,.05);border-radius:28px;padding:44px 40px;text-align:center}
.frac .top{font-weight:800;font-size:52px;color:var(--gold2);line-height:1.15}
.frac .bar{height:5px;background:var(--gold);margin:26px 0;border-radius:3px}
.frac .bot{font-weight:700;font-size:46px;line-height:1.2}
.s2 .note{margin-top:40px;font-size:34px;line-height:1.38;color:rgba(255,255,255,.85);padding-left:26px;border-left:5px solid var(--gold)}

/* 3 · Umbral */
.s3 .big{font-weight:800;font-size:240px;line-height:.9;color:var(--gold2);margin:6px 0 10px}
.s3 .big small{font-size:110px;color:#fff;margin-left:8px}
.s3 h2{font-size:64px;margin-bottom:44px}
.meter{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;margin-bottom:40px}
.meter div{padding:30px 34px;font-size:30px;line-height:1.3;font-weight:600}
.meter .l{background:rgba(255,255,255,.08);border:2px solid rgba(184,157,82,.5);border-radius:26px 0 0 26px;color:rgba(255,255,255,.8)}
.meter .r{background:var(--crit)}
.meter b{display:block;font-size:44px;font-weight:800;margin-bottom:4px}
.s3 .quote{font-size:46px;line-height:1.28;font-weight:600;border-left:8px solid var(--gold);padding-left:34px}
.s3 .quote em{font-style:normal;color:var(--gold2)}

/* 4 · Caso tipo */
.chip{display:inline-block;align-self:flex-start;border:2px solid var(--gold);color:var(--gold2);font-weight:700;font-size:28px;letter-spacing:.14em;padding:12px 24px;border-radius:999px;text-transform:uppercase;margin-bottom:26px}
.s4 h2{font-size:64px;margin-bottom:34px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{border-radius:26px;padding:34px 32px;background:rgba(255,255,255,.06);border-top:12px solid var(--crit)}
.card.after{border-top-color:var(--ok);background:rgba(46,125,79,.18)}
.card .lab{font-weight:700;font-size:26px;letter-spacing:.2em;color:rgba(255,255,255,.65);text-transform:uppercase}
.card .num{font-weight:800;font-size:120px;line-height:1;margin:14px 0 4px}
.card .num small{font-size:60px}
.card .unit{font-weight:600;font-size:32px;color:var(--gold2);line-height:1.25}
.arrowline{margin:34px 0 0;font-size:34px;line-height:1.4;color:rgba(255,255,255,.88);border-left:6px solid var(--gold);padding-left:26px}

/* 5 · El nombre */
.s5 .dx{font-size:130px;margin:6px 0 24px}
.s5 .esp{font-weight:700;font-size:42px;letter-spacing:.14em;color:var(--gold2);text-transform:uppercase;margin-bottom:56px}
.s5 .quote{font-size:52px;line-height:1.28;font-weight:600;border-left:8px solid var(--gold);padding-left:34px}
.s5 .quote em{font-style:normal;color:var(--gold2)}

/* 6 · Cierre */
.s6 h2{font-size:64px;margin-bottom:14px}
.s6 .sub{font-size:36px;color:rgba(255,255,255,.8);margin-bottom:34px}
.step{display:flex;align-items:center;gap:26px;background:rgba(255,255,255,.06);border:2px solid rgba(184,157,82,.5);border-radius:26px;padding:22px 32px;margin-bottom:16px}
.step .n{flex:0 0 auto;width:68px;height:68px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center}
.step .t{font-weight:700;font-size:36px;line-height:1.2}
.step .t span{display:block;font-weight:500;font-size:27px;color:rgba(255,255,255,.75);margin-top:4px}
.go{margin-top:18px;text-align:center;background:var(--gold);color:var(--navy);font-weight:800;font-size:42px;border-radius:999px;padding:26px}

/* Equilibrio vertical: baja el bloque principal para no dejar hueco abajo */
.s2 .eyebrow{margin-top:110px}
.s3 .big{margin-top:90px}
.s4 .chip{margin-top:90px}
.s5 .eyebrow{margin-top:120px}
.s6 h2{margin-top:70px}
.s2 .frac{padding:56px 40px}
.s2 .note{font-size:38px}
.s6 .step{padding:28px 32px}

/* Galería */
.sheet{display:flex;flex-wrap:wrap;gap:24px;padding:24px;background:#05080f}
.sheet .slot{width:324px;height:405px;position:relative;overflow:hidden;border-radius:10px}
.sheet .slot .frame{transform:scale(.3);transform-origin:top left}
.sheet .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);font-size:13px;padding:6px 10px}
.single .sheet,.single{padding:0;margin:0;display:block}
</style>
</head>
<body>
<div id="root"></div>

<template id="frames">
<!-- 1 · PORTADA -->
<div class="frame s1" data-n="1" data-name="01_portada">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 2</span><span class="txt">Analítica del domingo</span><span class="cnt">1/6</span></div>
    <h1>Facturas bien. <span class="gold">Y la cuenta no lo nota.</span></h1>
  </div>
  <div class="ecg"><svg viewBox="0 0 1080 200" fill="none" stroke="#D4B96A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M0,100 L170,100 L210,100 L250,30 L290,170 L330,100 L470,100 L505,100 L540,50 L575,150 L610,100 L720,100 L1080,100"/></svg></div>
  <div class="swipe">Desliza →</div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 2 · LA CONSTANTE -->
<div class="frame s2" data-n="2" data-name="02_constante">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 2</span><span class="txt">Analítica del domingo</span><span class="cnt">2/6</span></div>
    <div class="eyebrow">Tu constante vital</div>
    <h2>Facturación vencida sin cobrar</h2>
    <div class="frac">
      <div class="top">Facturas vencidas sin cobrar</div>
      <div class="bar"></div>
      <div class="bot">Facturado en los últimos 3 meses</div>
    </div>
    <div class="note">Cuenta como vencida cualquier factura que pasó su fecha de cobro, <b>aunque sea por un solo día</b>.</div>
  </div>
  <div class="swipe">Desliza →</div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 3 · EL UMBRAL -->
<div class="frame s3" data-n="3" data-name="03_umbral">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 2</span><span class="txt">Analítica del domingo</span><span class="cnt">3/6</span></div>
    <div class="big">20<small>%</small></div>
    <h2>Esa es la línea.</h2>
    <div class="meter">
      <div class="l"><b>Hasta el 20 %</b>Por debajo de la línea</div>
      <div class="r"><b>Más del 20 %</b>Fuga real de caja</div>
    </div>
    <div class="quote">Es beneficio tuyo<br><em>que está en manos de otros.</em></div>
  </div>
  <div class="swipe">Desliza →</div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 4 · CASO TIPO -->
<div class="frame s4" data-n="4" data-name="04_caso-tipo">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 2</span><span class="txt">Analítica del domingo</span><span class="cnt">4/6</span></div>
    <span class="chip">Caso tipo · Peluquería</span>
    <h2>9.000 € facturados en 3 meses. 1.800 € vencidos sin cobrar.</h2>
    <div class="duo">
      <div class="card"><div class="lab">Antes</div><div class="num">20<small> %</small></div><div class="unit">en la calle</div></div>
      <div class="card after"><div class="lab">Después</div><div class="num">8<small> %</small></div><div class="unit">vencido sin cobrar</div></div>
    </div>
    <div class="arrowline">Facturando <b class="gold">al entregar</b> y reclamando lo vencido con <b class="gold">carta formal</b>.</div>
  </div>
  <div class="swipe">Desliza →</div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 5 · EL NOMBRE -->
<div class="frame s5" data-n="5" data-name="05_diagnostico">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 2</span><span class="txt">Analítica del domingo</span><span class="cnt">5/6</span></div>
    <div class="eyebrow">Diagnóstico</div>
    <h2 class="dx">Fuga invisible</h2>
    <div class="esp">UCI Financiera</div>
    <div class="quote">No aparece en lo que facturas.<br><em>Aparece en lo que cobras.</em></div>
  </div>
  <div class="swipe">Desliza →</div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>

<!-- 6 · CIERRE -->
<div class="frame s6" data-n="6" data-name="06_cierre">
  <div class="safe">
    <div class="tag"><span class="pill">Nº 2</span><span class="txt">Analítica del domingo</span><span class="cnt">6/6</span></div>
    <h2>Tu número, y el de las otras 9 especialidades.</h2>
    <div class="sub">Escáner gratuito · 10 minutos</div>
    <div class="step"><div class="n">1</div><div class="t">Haces el Escáner<span>10 especialidades</span></div></div>
    <div class="step"><div class="n">2</div><div class="t">Recibes tu informe<span>con los síntomas detectados</span></div></div>
    <div class="step"><div class="n">3</div><div class="t">Tu código de acceso<span>a La Clínica de Empresas</span></div></div>
    <div class="go">Enlace en la biografía</div>
  </div>
  <div class="brand"><div class="wm">MASESORA<small>DINAMISMO EMPRESARIAL</small></div><div class="hd">@laclinicadeempresas</div></div>
</div>
</template>

<script>
(function(){
  var tpl=document.getElementById('frames').content;
  var root=document.getElementById('root');
  var q=new URLSearchParams(location.search);
  var only=q.get('f');
  var frames=Array.prototype.slice.call(tpl.querySelectorAll('.frame'));
  if(only){
    document.body.classList.add('single');
    var el=frames.filter(function(f){return f.getAttribute('data-n')===only})[0];
    root.appendChild(el);
  } else {
    var sheet=document.createElement('div');sheet.className='sheet';
    frames.forEach(function(f){
      var slot=document.createElement('div');slot.className='slot';
      slot.appendChild(f);
      var cap=document.createElement('div');cap.className='cap';cap.textContent=f.getAttribute('data-name');
      slot.appendChild(cap);sheet.appendChild(slot);
    });
    root.appendChild(sheet);
  }
})();
</script>
</body>
</html>
