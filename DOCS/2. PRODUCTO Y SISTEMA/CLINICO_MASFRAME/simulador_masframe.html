<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#141312;color:#f0ede8;min-height:100vh}
.topbar{background:#0d0d0d;border-bottom:1px solid #222;padding:8px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.topbar h1{font-size:13px;font-weight:700;color:#f0ede8;white-space:nowrap}

.main{max-width:820px;margin:0 auto;padding:14px}
.dash{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;padding:10px;background:#111;border-radius:8px;border:1px solid #1e1d1c}

.dot.ok{background:#4caf50;border-color:#4caf50}.dot.warn{background:#ff9800;border-color:#ff9800}.dot.err{background:#e53935;border-color:#e53935}
.symhead{margin-bottom:12px}
.symid{font-size:11px;color:#555;font-family:monospace}
.symname{font-size:20px;font-weight:700;margin:3px 0}
.symlogica{font-size:13px;color:#888;font-style:italic;margin-bottom:4px}
.scorebar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:#111;border-radius:8px;border:1px solid #1e1d1c}
.score-num{font-size:28px;font-weight:700;min-width:52px}
.score-label{font-size:12px;font-weight:600}
.score-detail{font-size:11px;color:#666;margin-left:auto}
.issues{margin-bottom:14px}
.issue{border-radius:6px;margin-bottom:6px;overflow:hidden}
.issue-head{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;cursor:pointer}

.issue.err .issue-head{background:#2a1010;border-left:3px solid #e53935}
.issue.warn .issue-head{background:#251e0a;border-left:3px solid #ff9800}
.issue-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.issue-layer{font-size:10px;color:#666;font-family:monospace;white-space:nowrap;margin-top:1px}
.issue-desc{font-size:12px;line-height:1.4;flex:1}
.issue-chev{color:#444;font-size:12px;flex-shrink:0;transition:transform .2s}
.issue-chev.open{transform:rotate(180deg)}
.issue-body{display:none;border-top:1px solid #1a1a1a}
.issue.err .issue-body{background:#200c0c}.issue.warn .issue-body{background:#1e1700}
.issue-body.open{display:block}
.pair{padding:10px 12px}
.pair-row{display:flex;gap:8px;margin-bottom:6px}
.pair-col{flex:1;border-radius:5px;padding:8px 10px;font-size:12px;line-height:1.5}
.col-json{background:#161616;border:1px solid #2a2a2a;color:#aaa}
.col-exp{background:#0d1a0d;border:1px solid #1e3a1e;color:#c8e6c9}
.col-lbl{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pair-btns{display:flex;gap:5px;margin-top:6px}
.pbtn{padding:4px 10px;border-radius:4px;border:1px solid #333;background:#1a1a1a;color:#888;cursor:pointer;font-size:11px}
.pbtn:hover{background:#222;color:#ccc}
.pbtn.acc{background:#0d1a0d;border-color:#4caf50;color:#a5d6a7}
.pbtn.rej{background:#2a1010;border-color:#e53935;color:#ef9a9a}
.pair-note{width:100%;background:#131312;border:1px solid #222;color:#ccc;font-size:11px;padding:5px 7px;border-radius:4px;resize:vertical;min-height:44px;margin-top:5px;display:none}
.pair-note.show{display:block}
.pair-note:focus{outline:none;border-color:#4fc3f7}
.reasoning{font-size:11px;color:#666;line-height:1.4;border-top:1px solid #1a1a1a;padding:8px 12px;font-style:italic}

.sec-head:hover{background:#1e1d1c}
.stag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.05em}

.t2{background:#1b5e20;color:#c8e6c9}.t3{background:#4e342e;color:#ffccbc}
.t4{background:#bf360c;color:#fff}.t5{background:#37474f;color:#cfd8dc}
.t6{background:#880e4f;color:#f8bbd0}
.sec-title{font-size:13px;font-weight:600;flex:1}
.sec-sub{font-size:11px;color:#555}

.schev.open{transform:rotate(180deg)}
.sbody{padding:12px;border-top:1px solid #1e1d1c;display:none}
.sbody.open{display:block}
.kinp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ig{flex:1;min-width:160px}

.ig input{width:100%;background:#111;border:1px solid #2a2a2a;color:#f0ede8;padding:6px 8px;border-radius:4px;font-size:13px}

.kbox{background:#111;border-radius:5px;padding:9px 11px;display:flex;align-items:center;gap:12px}

.ksub{font-size:11px;color:#555}.kdet{font-size:11px}

.c1opts{display:flex;flex-direction:column;gap:4px}

.toolcard{background:#111;border-radius:5px;padding:9px 11px;margin-bottom:6px}
.tool-name{font-size:12px;font-weight:600;color:#a5d6a7;margin-bottom:2px}
.tool-comp{font-size:11px;color:#555;margin-bottom:3px}
.tool-role{font-size:12px;color:#888;line-height:1.4}
.c2opts{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.c2opt{padding:7px 9px;border-radius:4px;background:#0a120a;border:1px solid #1a2a1a;font-size:12px;line-height:1.4}
.pstep{padding:8px 10px;border-radius:4px;margin-bottom:4px;font-size:12px}
.pstep.c3{background:#110816;border-left:3px solid #7b1fa2}
.pstep.c4{background:#130e02;border-left:3px solid #f57f17}
.pstep.c5{background:#080e10;border-left:3px solid #37474f}
.psl{font-size:9px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.psn{font-weight:600;margin-bottom:2px}.psd{color:#666}
.verdict{background:#0d0d0d;border-radius:7px;padding:12px;margin-top:10px;border:1px solid #1e1d1c}
.vttl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.vq{font-size:12px;color:#888;margin-bottom:7px;line-height:1.4}
.vbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.vbtn{padding:6px 12px;border-radius:4px;border:1px solid #2a2a2a;background:#1a1a1a;color:#777;cursor:pointer;font-size:12px;font-weight:500}

.vbtn.v-ok{background:#0d1a0d;border-color:#4caf50;color:#a5d6a7}
.vbtn.v-warn{background:#1e1700;border-color:#ff9800;color:#ffcc80}

.vnote:focus{outline:none;border-color:#4fc3f7}
.empty{color:#444;font-size:11px;padding:6px 0}
</style>

.", "capa_4_cambio": "Rediseño de portafolio", "justi_capa4": "Porque necesitas ajustar oferta, precios o dedicación basándote en la clasificación real.", "capa_5_ejecucion": "Checklist de rentabilidad", "justi_capa5": "Porque necesitas asegurar que los cambios se ejecutan y el margen real mejora.", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir la mejora del margen por cliente o servicio tras aplicar el rediseño.", "capa_1_options": "No sé si mis tarifas cubren realmente lo que me cuesta cada servicio; Hay clientes o proyectos que ocupan mucho tiempo y pagan poco; Dedico horas a tareas que no sé si alguien podría hacer por mí; Tengo proveedores o gastos fijos que nunca he revisado en serio; Hago formaciones, reuniones o gestiones que no generan ingreso directo; Hay servicios o productos que vendo mucho pero no sé si son los que más me dejan", "c2_herramienta": "retencion"}, {"specialty_id": "UCI FINANCIERA", "explanation": "Aquí tratamos los casos donde la empresa ya no puede permitirse un error más. Si has llegado hasta esta unidad es porque tu negocio está enviando señales claras de agotamiento financiero: tensión de caja decisiones urgentes y riesgo real. En esta UCI estabilizamos la liquidez como si fuera un órgano vital. No parcheamos. No improvisamos. Actuamos con precisión clínica para evitar el colapso.", "lema": "Controlar el flujo de caja es la clave, y aquí vamos a detener esta hemorragia financiera.", "orden": 3, "symptom_id": "UCI-S3", "department": "Finanzas", "symptom_name": "Anemia de Margen", "logica": "Cobras lo que el mercado aguanta o lo que cobra la competencia — pero nadie ha calculado si ese precio te deja beneficio real.", "plan": "PIE", "description_symptom": "Si nunca has calculado cuánto te queda después de pagar todos tus gastos reales — incluyendo impuestos y lo que deberías cobrarte como sueldo — estás fijando precios a ciegas. Muchos autónomos facturan bien y sobreviven mal porque su precio no cubre su coste real de vida empresarial.", "kpi_question": "Introduce tu facturación mensual total y el total de costes directos mensuales — materiales, subcontratas y gastos directos. Si tu margen mensual es inferior al 30%, estás trabajando para pagar gastos, no para generar beneficio real.", "kpi_impact": "Un margen mensual superior al 30% sobre tu facturación garantiza que tu negocio genera valor real, no solo movimiento de caja.", "kpi_formula": "((InputA-InputB)/InputA)*100", "kpi_objective": ">30%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Facturación mensual total"}, {"id": "inputB", "label": "Costes directos mensuales totales (materiales, subcontratas, gastos directos)"}], "input_a": "Facturación mensual total", "input_b": "Costes directos mensuales totales (materiales, subcontratas, gastos directos)", "input_revised_1": "Días desde entrega hasta factura (post)", "input_revised_2": "Días desde factura hasta cobro (post)", "result_revised": "Δ días ganados", "impact_treatment": "Recalculamos tu estructura de costes y rediseñamos el precio para que cada venta tenga margen garantizado. Vender más deja de significar trabajar más para ganar lo mismo.", "optimizer_impact": "El precio se fija con datos reales, no con referencia al mercado o a la competencia.", "optimizer_decision": "Cálculo de Precio Mínimo Viable", "example": "Tienda de alimentación: pasa de 42 días a 28 días y libera 7000€ de liquidez.", "capa_1_priorizacion": "El ciclo order-to-cash es excesivamente largo; existe un cuello de botella entre entrega y cobro; la facturación se retrasa; el cliente tarda demasiado en pagar; el flujo depende de procesos lentos; no existe protocolo de aceleración; la empresa no mide tramos; la caja se asfixia por retrasos acumulados.", "justi_capa1": "El ciclo de cobro supera los 30 días y presenta un cuello de botella claro entre entrega facturación y pago.", "capa_2_decision": "Semáforo de Viabilidad", "capa_2_options": "Calcular el precio mínimo por debajo del cual cada venta te cuesta dinero; Medir cuánto margen real te queda después de aplicar tus descuentos habituales; Cuantificar el impacto de la subida de costes y el precio al que deberías estar; Calcular tu hora real facturada incluyendo el tiempo que trabajas sin cobrar; Comparar el margen real de cada línea e identificar cuáles te sostienen y cuáles te drenan; Calcular la rentabilidad real de cada cliente incluyendo el tiempo y recursos que consume", "justi_capa2": "Para cada problema que has marcado, calcula el margen real de tus servicios — incluyendo los costes que normalmente no aparecen en la factura.", "capa_3_comprension": "Análisis de estructura de costes", "justi_capa3": "Porque necesitas identificar qué coste concreto destruye tu margen en cada línea o servicio.", "capa_4_cambio": "Rediseño de pricing y costes", "justi_capa4": "Porque necesitas ajustar precios y cortar los costes que erosionan el margen real.", "capa_5_ejecucion": "Checklist de revisión de margen", "justi_capa5": "Porque necesitas confirmar que los cambios de precio y coste se ejecutaron.", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir la reducción del ciclo de cobro.", "capa_1_options": "Dudo si mi carta de precios es la correcta; Hago descuentos para fidelizar y facturar más, pero no sé si me estoy pasando; Los costes han subido pero no he podido repercutirlos al cliente; Hay trabajo que hago y no cobro: soporte, cambios o revisiones fuera de precio; Tengo servicios o líneas pero no sé cuál me deja margen de verdad; Quiero analizar clientes en concreto", "c2_herramienta": "margen"}, {"specialty_id": "UNIDAD DE PROCESOS", "explanation": "Cuando los procesos fallan el tiempo se convierte en un enemigo silencioso. Cuellos de botella, urgencias constantes y desgaste operativo están ralentizando tu empresa. En esta unidad reordenamos y simplificamos tu sistema operativo para devolver fluidez ritmo y control real.", "lema": "Sin un proceso definido, la operación se vuelve lenta y la pérdida se vuelve invisible.", "orden": 11, "symptom_id": "UNI-S1", "department": "Procesos", "symptom_name": "Esclerosis Operativa", "logica": "Tu operación avanza por inercia, sin diseño — y cada día que pasa ese desorden te cuesta más de lo que crees.", "plan": "PIE", "description_symptom": "Si tu operación funciona porque siempre ha funcionado así — sin que nadie haya diseñado cómo debería funcionar — cada paso acumula un coste oculto. Las esperas, los cuellos de botella y los pasos sin valor llevan años comiéndote tiempo sin que nadie los haya atacado.", "kpi_question": "De todo lo que entregaste esta semana — citas, pedidos, trabajos — ¿cuántos salieron sin ningún problema: sin retraso, sin reproceso, sin imprevisto?", "kpi_impact": "Si menos del 85% de tu trabajo sale limpio a la primera, hay fricciones operativas activas que te cuestan tiempo y reputación sin que las hayas medido todavía.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": ">85%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Servicios o pedidos entregados sin ningún problema esta semana"}, {"id": "inputB", "label": "Total de servicios o pedidos de la semana"}], "input_a": "Servicios o pedidos entregados sin ningún problema esta semana", "input_b": "Total de servicios o pedidos de la semana", "input_revised_1": "Servicios sin problema (post)", "input_revised_2": "Total servicios (post)", "result_revised": "Δ % roturas de flujo", "impact_treatment": "Rediseñamos tu flujo operativo eliminando el tiempo invisible que consumen los procesos sin protocolo. La misma energía produce resultados medibles, sin rozamiento.", "optimizer_impact": "Aceleración inmediata del ciclo operativo sin aumentar recursos ni contratar.", "optimizer_decision": "Mapeo de Esperas y Flujo Real", "example": "Taller de carpintería: pedidos tardaban 9 días pero solo 2 eran de trabajo real. Tras eliminar esperas, bajan a 4 días totales", "capa_1_priorizacion": "El proceso tiene demasiadas esperas; hay tiempos muertos entre tareas; el flujo operativo no es continuo; las tareas se acumulan en ciertos puntos; no existe un estándar de flujo; el equipo espera información o aprobaciones; hay cuellos de botella recurrentes; el proceso completo es más lento de lo necesario.", "justi_capa1": "El flujo operativo presenta múltiples esperas y cuellos de botella, por lo que es necesario priorizar qué eliminar primero para acelerar el proceso.", "capa_2_decision": "Impacto vs Esfuerzo", "capa_2_options": "Mapear el flujo operativo completo para ver dónde se pierde tiempo; Identificar las tres esperas críticas que más retrasan el proceso; Eliminar los pasos del proceso que no aportan valor real; Crear un estándar de cómo se hacen las tareas más repetidas; Implementar un tablero visual para que todos vean el estado del trabajo; Establecer tiempos máximos de respuesta para aprobaciones internas", "justi_capa2": "Con Impacto vs Esfuerzo, el cliente coloca cada opción en la matriz según su valor real y la dificultad de ejecutarla. Lo que queda en el cuadrante \"alto impacto / baja dificultad\" es donde empieza el tratamiento.", "capa_3_comprension": "VSM (flujo operativo)", "justi_capa3": "El VSM (flujo operativo) hace visible lo que todos conocen pero nadie ha visto junto: dónde se pierde tiempo, dónde se acumula trabajo y qué pasos no aportan valor. Sin ese mapa, las mejoras en C4 son parciales.", "capa_4_cambio": "Kaizen operativo", "justi_capa4": "Con el Kaizen operativo, cada mejora identificada en \"VSM (flujo operativo)\" tiene un responsable, una acción concreta y un plazo. El cambio empieza aquí y el CC hace seguimiento en C5.", "capa_5_ejecucion": "Kanban", "justi_capa5": "Porque necesitas visualizar y controlar el flujo de trabajo.", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir la reducción de tiempos de espera.", "capa_1_options": "Algo que debería hacerse en un día nos lleva una semana; Siempre hay algo esperando a alguien para poder avanzar; El mismo punto del proceso se atasca una y otra vez; El equipo pierde tiempo esperando aprobaciones o información; No tenemos claro cómo se hacen las cosas cada uno lo hace a su manera; Hay procesos que nadie revisa y los errores se repiten sin resolverse"}, {"specialty_id": "UNIDAD DE PROCESOS", "explanation": "Cuando los procesos fallan el tiempo se convierte en un enemigo silencioso Cuellos de botella urgencias constantes y desgaste operativo están ralentizando tu empresa En esta unidad reordenamos y simplificamos tu sistema operativo para devolver fluidez ritmo y control real", "lema": "Sin un proceso definido, la operación se vuelve lenta y la pérdida se vuelve invisible.", "orden": 12, "symptom_id": "UNI-S2", "department": "Procesos", "symptom_name": "Colapso de Capacidad", "logica": "Trabajas al límite y siempre hay algo sin hacer — porque el problema no es tu esfuerzo, es cómo está organizado el trabajo.", "plan": "PIE", "description_symptom": "Si tu equipo trabaja al máximo pero siempre hay cola, es porque el problema no es capacidad — es organización. Las tareas que llegan mal definidas, los reprocesos constantes y la falta de estándar consumen más horas que cualquier aumento de plantilla podría cubrir.", "kpi_question": "De todo lo que entregaste esta semana — citas, pedidos, proyectos, trabajos — ¿cuántos llegaron al cliente en el plazo que prometiste cuando lo vendiste?", "kpi_impact": "Si menos del 90% de tus entregas cumplen el plazo prometido, el sistema está operando por encima de su capacidad real — y eso lo paga el cliente en forma de esperas que no esperaba.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": ">90%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Entregas realizadas en el plazo prometido al cliente esta semana"}, {"id": "inputB", "label": "Total de entregas de la semana"}], "input_a": "Entregas realizadas en el plazo prometido al cliente esta semana", "input_b": "Total de entregas de la semana", "input_revised_1": "Entregas en plazo (post)", "input_revised_2": "Total entregas (post)", "result_revised": "Δ % cumplimiento de plazo", "impact_treatment": "Reorganizamos la carga para que el equipo rinda al límite real de su capacidad, no al de sus urgencias. Crecer deja de significar reventar.", "optimizer_impact": "Aumento inmediato de velocidad operativa al eliminar reprocesos por entradas defectuosas.", "optimizer_decision": "Filtro de Entrada de Tareas", "example": "Agencia de diseño 41 por ciento de tareas llegaban incompletas Tras checklist baja a 8 por ciento y reduce tiempos un 37 por ciento", "capa_1_priorizacion": "La información entra incompleta hay errores frecuentes en la entrada de tareas el equipo pierde tiempo aclarando información no existe un estándar de intake las tareas llegan con datos inconsistentes hay confusión sobre qué se necesita el proceso se colapsa por mala entrada la calidad depende de quién envía la información", "justi_capa1": "El sistema de entrada de tareas es inconsistente y genera colapso operativo por lo que es necesario entender causas internas y externas para rediseñar el intake", "capa_2_decision": "Análisis de Carga", "capa_2_options": "Entrada de tareas (intake); Coordinación entre áreas; Gestión de colas y prioridades; Formación y onboarding de nuevas personas; Revisión y control de calidad; Comunicación con cliente o demandante", "justi_capa2": "El Análisis de Carga clasifica el origen del problema en categorías medibles. Lo que tiene mayor frecuencia e impacto es lo que el tratamiento atacará primero.", "capa_3_comprension": "Ishikawa", "justi_capa3": "El Ishikawa traza el camino desde el síntoma visible hasta la causa raíz de lo que el cliente priorizó en C2. Sin ese recorrido, C4 atacaría el síntoma en lugar de la causa.", "capa_4_cambio": "Rediseño de intake", "justi_capa4": "Con los datos que entregó \"Ishikawa\", el Rediseño de intake no es una opinión — es una decisión basada en números reales. Cada cambio tiene una consecuencia cuantificada.", "capa_5_ejecucion": "Checklist de entrada de tareas", "justi_capa5": "Porque necesitas estandarizar qué información mínima debe llegar", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir la reducción de errores de entrada", "capa_1_options": "Trabajamos al máximo pero siempre hay tareas en cola sin terminar; Pierdo tiempo aclarando trabajos que llegan mal explicados; Cada uno hace las cosas a su manera sin un estándar; Cuando llega trabajo nuevo siempre falta información clave para empezar; Por más horas que metemos nunca llegamos a todo; Contratar más gente no resuelve el atasco real"}, {"specialty_id": "UNIDAD DE PROCESOS", "explanation": "Cuando los procesos fallan el tiempo se convierte en un enemigo silencioso Cuellos de botella urgencias constantes y desgaste operativo están ralentizando tu empresa En esta unidad reordenamos y simplificamos tu sistema operativo para devolver fluidez ritmo y control real", "lema": "Sin un proceso definido, la operación se vuelve lenta y la pérdida se vuelve invisible.", "orden": 13, "symptom_id": "UNI-S3", "department": "Procesos", "symptom_name": "Fuga de Calidad Crónica", "logica": "Los mismos errores, las mismas quejas, el mismo retrabajo — porque nadie ha cerrado todavía las brechas que los generan.", "plan": "PIE", "description_symptom": "Si las mismas correcciones aparecen semana tras semana, no es mala suerte ni falta de cuidado — es que hay brechas estructurales que nadie ha cerrado. Cada retrabajo es tiempo y margen que regalas sin necesidad.", "kpi_question": "Introduce cuántas entregas requirieron corrección o generaron una queja este mes y el total de entregas realizadas. Si más del 5% falla, estás absorbiendo un coste crónico de retrabajo que no aparece en ninguna factura pero sí en tu margen.", "kpi_impact": "Mantener el retrabajo por debajo del 5% libera horas críticas, aumenta la capacidad real y mejora la percepción de calidad del cliente.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": "<5%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Entregas que requirieron corrección o generaron queja este mes"}, {"id": "inputB", "label": "Total entregas realizadas este mes"}], "input_a": "Entregas que requirieron corrección o generaron queja este mes", "input_b": "Total entregas realizadas este mes", "input_revised_1": "Entregas con corrección o queja (post)", "input_revised_2": "Total entregas realizadas (post)", "result_revised": "Δ % de retrabajo", "impact_treatment": "Cerramos las brechas operativas que generan retrabajo, quejas y coste invisible. Cada proceso pasa a funcionar a la primera — sin retroceder.", "optimizer_impact": "Aumento inmediato de capacidad operativa al eliminar el coste del retrabajo crónico.", "optimizer_decision": "Diagnóstico de Causa Raíz de Calidad", "example": "Estudio de arquitectura 27 por ciento de entregas requerían correcciones Tras protocolo baja a 6 por ciento y libera 42 horas al mes", "capa_1_priorizacion": "Se repiten defectos en las entregas hay demasiado retrabajo no existe un control de calidad consistente el equipo corrige errores en lugar de prevenirlos no se llega a la causa raíz la calidad depende de la persona no hay estándares claros el retrabajo consume demasiados recursos", "justi_capa1": "Los fallos repetidos generan retrabajo y riesgo operativo por lo que es necesario identificar qué errores son críticos y eliminarlos desde la causa raíz", "capa_2_decision": "Pareto de Fallos", "capa_2_options": "Frecuencia: qué tipo de error aparece más veces; Coste: qué defecto consume más horas de retrabajo; Origen: en qué fase del proceso ocurre el fallo; Impacto externo: qué errores generan quejas del cliente; Consistencia: si el fallo varía según quién entrega; Estándar: si hay protocolo definido para ese paso o no", "justi_capa2": "Porque necesitas identificar qué fallos generan más retrabajo", "capa_3_comprension": "5 Porqués", "justi_capa3": "Porque necesitas llegar a la causa raíz de los defectos", "capa_4_cambio": "Plan de calidad continua", "justi_capa4": "Porque necesitas estabilizar la calidad y reducir retrabajo", "capa_5_ejecucion": "Checklist de control de calidad", "justi_capa5": "Porque necesitas asegurar que cada entrega cumple estándar", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir la reducción del retrabajo", "capa_1_options": "Aparecen los mismos errores y las mismas quejas una y otra vez; Dedico demasiado tiempo a corregir y rehacer trabajo; No tengo un control de calidad que funcione de verdad; El equipo apaga fuegos en lugar de evitar que ocurran; Si entrega una persona sale bien y si entrega otra no; El retrabajo se está comiendo mi margen sin que lo vea"}, {"specialty_id": "CARDIOLOGIA COMERCIAL", "explanation": "El corazón comercial de tu empresa late más lento de lo que debería Mensajes confusos propuestas débiles y oportunidades que se enfrían Aquí reactivamos tu pulso comercial para que tu comunicación vuelva a generar confianza ventas y crecimiento", "lema": "¿Boca a boca? ¿web? ¿google?, ¿Cómo vende tu negocio?", "orden": 20, "symptom_id": "CARDIO-S1", "department": "Comercial", "symptom_name": "Atrofia Comercial", "logica": "Tu negocio no genera clientes por sí solo — dependes del boca a boca y de que llegue el momento oportuno.", "plan": "PIE", "description_symptom": "Si la mayoría de tus clientes llegan por recomendación o por casualidad, tu crecimiento no está en tus manos. No tienes un motor de demanda — tienes esperanza. Y la esperanza no es una estrategia comercial.", "kpi_question": "¿Cuántos clientes nuevos atendiste este mes y cuántos clientes en total? Si menos del 20% son nuevos, tu negocio no tiene motor comercial — depende de los que ya tiene.", "kpi_impact": "Si menos del 20% de tus clientes son nuevos cada mes, el negocio no genera demanda propia — crece solo si el boca a boca llega solo. Eso no es un sistema, es suerte.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": ">20%", "threshold_critical": 10, "threshold_recommended": 15, "threshold_optimizer": 20, "threshold_elite": 30, "inputs": [{"id": "inputA", "label": "Clientes nuevos este mes"}, {"id": "inputB", "label": "Total de clientes atendidos este mes"}], "input_a": "Clientes nuevos este mes", "input_b": "Total de clientes atendidos este mes", "input_revised_1": "Clientes nuevos (post)", "input_revised_2": "Total clientes atendidos (post)", "result_revised": "Δ % clientes nuevos sobre total", "impact_treatment": "Identificamos qué clientes y productos te dejan más margen y construimos un sistema para atraer más de esos. Dejas de vender lo que llega y empiezas a crecer por diseño.", "optimizer_impact": "Activación inmediata del motor de demanda con el canal de mayor retorno.", "optimizer_decision": "Diagnóstico de Motor Comercial", "example": "Estudio de nutrición 11 oportunidades generadas necesitaba 20 Tras activar canal dominante genera 18 y duplica cierres", "capa_1_priorizacion": "Falta de oportunidades comerciales motor débil dependencia de recomendaciones ausencia de canal dominante captación irregular crecimiento impredecible ventas insuficientes falta de visibilidad falta de tráfico", "justi_capa1": "No hay suficiente demanda para sostener crecimiento necesitas medir brecha real", "capa_2_decision": "Análisis de Riesgos", "capa_2_options": ["Riesgo de ceguera financiera: no hay previsión de facturación — el negocio no sabe qué va a ingresar en los próximos 60 días", "Riesgo de esfuerzo ciego: el equipo invierte el mismo tiempo en oportunidades de alta y baja probabilidad sin ningún criterio", "Riesgo de cuello de botella invisible: el cierre falla siempre en el mismo punto pero nadie lo ha medido ni identificado", "Riesgo de dependencia del fundador: si el dueño es el único que sabe vender, el negocio no escala ni puede contratar", "Riesgo de pérdida de oportunidades: el 20% de los contactos genera el 80% de las ventas pero ese 20% no está identificado ni priorizado", "Riesgo de improvisación: sin objetivos, sin presupuesto y sin criterios de cualificación cada comercial decide distinto ante la misma situación"], "justi_capa2": "Porque necesitas priorizar qué canal activar primero", "capa_3_comprension": "Auditoría Comercial", "justi_capa3": "Porque necesitas ver qué canal genera oportunidades reales", "capa_4_cambio": "Arquitectura Comercial", "justi_capa4": "Porque necesitas encender el motor de demanda", "capa_5_ejecucion": "Checklist Comercial", "justi_capa5": "Porque necesitas constancia semanal", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir oportunidades generadas", "capa_1_options": "La mayoría de mis clientes llegan por recomendación o de casualidad; No sé qué canal me trae clientes y cuál es perder el tiempo; Sigo invirtiendo en sitios sin saber si funcionan; Mi crecimiento es impredecible un mes va bien y al siguiente no; No tengo una forma constante de captar clientes nuevos; Dependo de que me conozcan no de que me encuentren"}, {"specialty_id": "CARDIOLOGIA COMERCIAL", "explanation": "El corazón comercial de tu empresa late más lento de lo que debería Mensajes confusos propuestas débiles y oportunidades que se enfrían Aquí reactivamos tu pulso comercial para que tu comunicación vuelva a generar confianza ventas y crecimiento", "lema": "S¿Boca a boca? ¿web? ¿google?, ¿Cómo vende tu negocio?", "orden": 21, "symptom_id": "CARDIO-S2", "department": "Comercial", "symptom_name": "Arritmia Comercial", "logica": "Un mes bien, el siguiente mal — sin entender por qué cambia ni cómo controlarlo.", "plan": "PIE", "des r al 15%, tu modelo trabaja más de lo que rentabiliza.", "kpi_impact": "Cuando el margen neto anual supera el 15%, el modelo está diseñado para crear riqueza real — no solo volumen.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": ">15%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Beneficio neto del último año — lo que quedó después de pagar todo (€)"}, {"id": "inputB", "label": "Facturación total del último año (€)"}], "input_a": "Beneficio neto del último año (€)", "input_b": "Facturación total del último año (€)", "input_revised_1": "Beneficio neto anual (post)", "input_revised_2": "Facturación anual (post)", "result_revised": "Δ margen neto anual", "impact_treatment": "Rediseñamos el modelo para que cada euro de facturación deje más margen real. Crecer pasa a significar ganar más, no solo facturar más.", "optimizer_impact": "Reducción inmediata del riesgo de obsolescencia al identificar las líneas que necesitan revisión urgente.", "optimizer_decision": "Diagnóstico de Portafolio de Negocio", "example": "Agencia de marketing solo 38 por ciento decisiones con criterio Tras protocolo sube a 67 por ciento", "capa_1_priorizacion": "Productos dudosos decisiones difíciles portafolio amplio consumo de recursos criterios poco claros inercia falta de análisis margen no optimizado", "justi_capa1": "Las decisiones no siguen criterio necesitas medirlo", "capa_2_decision": "Árbol de Decisiones", "capa_2_options": "¿Mantener servicios de bajo margen para completar oferta o eliminarlos?; ¿Crecer en volumen aceptando márgenes más bajos o priorizar rentabilidad?; ¿Subir precios arriesgando perder clientes o mantenerlos y perder margen?; ¿Especializarme en el servicio más rentable o mantener la diversidad?; ¿Invertir en automatización para reducir costes o en captación para crecer?; ¿Rediseñar el modelo de negocio ahora o esperar a que la situación empeore?", "justi_capa2": gen neto real superior al 15% confirma que el negocio es viable. Por debajo, estás trabajando para cubrir costes.", "kpi_formula": "((InputA-InputB)/InputA)*100", "kpi_objective": ">15%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Ingresos brutos del último mes (€)"}, {"id": "inputB", "label": "Gastos totales reales del último mes — incluyendo impuestos estimados y sueldo del dueño (€)"}], "input_a": "Ingresos brutos del mes", "input_b": "Gastos totales reales del mes", "input_revised_1": "Dias de cierre post", "input_revised_2": "Dias objetivo post", "result_revised": "Δ dias de cierre", "impact_treatment": "Instalamos el cuadro de mando que convierte tus números en señales claras. A partir de ahora tomas decisiones con datos reales, no con sensaciones que te pueden engañar.", "optimizer_impact": "Aceleración inmediata de decisiones al disponer de datos fiables en tiempo real.", "optimizer_decision": "Diagnóstico de Visibilidad Financiera", "example": "Despacho profesional cierre en 19 dias Tras protocolo baja a 6 dias", "capa_1_priorizacion": "Cierre lento datos viejos errores repetidos tareas manuales falta de estandar dependencias ocultas cuellos de botella falta de visibilidad", "justi_capa1": "Tu cierre mensual es lento necesitas medirlo", "capa_2_decision": "Regla 5/25", "capa_2_options": "Definir los 3 indicadores que muestran la salud real del negocio; Establecer un cierre contable mensual en los primeros 5 días del mes; Crear una hoja de caja previsional para los próximos 90 días; Implementar un dashboard financiero semanal con 5 métricas clave; Automatizar la extracción de datos del banco y contabilidad; Delegar o subcontratar las tareas administrativas de bajo valor (archivo, auxiliar)", "justi_capa2": "Porque necesitas priorizar bloqueos del cierre", "capa_3_comprension": "VSM financiero", "justi_capa3": "Porque necesitas ver el flujo completo", "capa_4_cambio": "Kaizen administrativo", "justi_capa4": "Porque necesitas reducir tiempos muertos", "capa_5_ejecucion": "Checklist de cierre", "justi_capa5": "Porque necesitas estandarizar", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir velocidad de cierre", "capa_1_options": "Tomo decisiones con números que ya no son de fiar; No sé exactamente cuánto me queda tras pagarlo todo; Mi cierre de cuentas es lento y llega tarde; Repito errores porque no veo los números a tiempo; Dependo de tareas manuales para saber cómo voy; No tengo visibilidad clara de mi situación real"}, {"specialty_id": "GESTION CLINICA", "explanation": "Hay empresas que funcionan pero a costa de demasiado esfuerzo Sistemas forzados personas agotadas y estructuras al limite Aqui rehabilitamos la organizacion para que avance con orden gobernanza y estabilidad real", "lema": "Reaccionar no es liderar; avanzar con claridad y dirección, sí.", "orden": 42, "symptom_id": "CLI-S2", "department": "Gestion", "symptom_name": "Sangría Fiscal", "logica": "Pagas más impuestos de los que te corresponden — y llevas años sin saberlo.", "plan": "PIE", "description_symptom": "Si nunca has calculado tu tipo impositivo real, ni comparado si tributar como SL te saldría mejor, ni revisado qué gastos legítimos podrías deducir — estás dejando dinero en Hacienda cada año sin necesidad. No es evasión. Es ineficiencia estructural que se repite en silencio.", "kpi_question": "Introduce el total de impuestos que pagaste el último año — IRPF o Impuesto de Sociedades más Seguridad Social como autónomo — y tu beneficio bruto antes de impuestos. El resultado es tu tipo impositivo efectivo real: lo que el Estado se lleva de cada euro que generas.", "kpi_impact": "Un tipo impositivo efectivo por debajo del 32% indica una estructura fiscal razonablemente optimizada. Por encima, hay margen de mejora real — y cada punto porcentual son miles de euros al año.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": utónomo con tu facturación; Documentar y justificar todos los gastos de negocio deducibles del último ejercicio; Establecer con tu asesor un plan de optimización fiscal para el próximo ejercicio", "justi_capa2": "Porque necesitas priorizar qué cambios fiscales tienen mayor impacto con menor complejidad de implementación.", "capa_3_comprension": "Mapa de carga fiscal", "justi_capa3": "Porque necesitas ver exactamente qué parte de tu facturación se va en cada tipo de impuesto y dónde está la mayor ineficiencia.", "capa_4_cambio": "Rediseño de estructura fiscal", "justi_capa4": "Porque necesitas implementar los cambios que reducen tu carga fiscal real de forma legal y sostenible.", "capa_5_ejecucion": "Checklist de optimización fiscal", "justi_capa5": "Porque necesitas confirmar que cada medida acordada con tu asesor se ha ejecutado.", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir la reducción real del tipo impositivo efectivo año a año.", "capa_1_options": "Pago impuestos cada trimestre pero nunca sé exactamente cuánto voy a pagar hasta que llega la liquidación; Nunca he calculado si me convendría más tributar como SL que como autónomo; No tengo claro qué gastos del negocio puedo deducir realmente; Mi asesor gestiona mis impuestos pero yo no entiendo lo que pago ni por qué; Tengo la sensación de que pago demasiado en proporción a lo que gano; Nunca he revisado si el régimen fiscal en el que estoy es el más ventajoso para mí"}, {"specialty_id": "GESTION CLINICA", "explanation": "Hay empresas que funcionan pero a costa de demasiado esfuerzo Sistemas forzados personas agotadas y estructuras al limite Aqui rehabilitamos la organizacion para que avance con orden gobernanza y estabilidad real", "lema": "Reaccionar no es liderar; avanzar con claridad y dirección, sí.", "orden": 43, "symptom_id": "CLI-S3", "department": "Gestion", "symptom_name": "Atrofia de Roles", "logica": "Todo acaba en el mismo despacho porque nadie sabe exactamente qué le ecesitas medir dependencia", "capa_2_decision": "Árbol de Decisiones", "capa_2_options": "¿Crear una matriz de responsabilidades aunque implique conversaciones incómodas sobre quién hace qué?; ¿Definir qué decisiones puede tomar cada persona sin consultarme aunque suponga ceder control?; ¿Documentar y reasignar las tareas huérfanas aunque nadie las haya reclamado hasta ahora?; ¿Establecer un protocolo de escalado aunque signifique que algunos temas ya no lleguen a mí?; ¿Revisar y reescribir la descripción de funciones de cada rol aunque genere resistencia?; ¿Hacer una sesión de aclaramiento de roles con todo el equipo aunque saque tensiones a la superficie?", "justi_capa2": "Porque necesitas priorizar huecos de responsabilidad", "capa_3_comprension": "Mapa de Responsabilidades", "justi_capa3": "Porque necesitas visualizar quien hace que", "capa_4_cambio": "Definición de Roles", "justi_capa4": "Porque necesitas claridad interna", "capa_5_ejecucion": "Checklist de Roles", "justi_capa5": "Porque necesitas sostener estructura", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir dependencia real", "capa_1_options": "Casi todas las decisiones acaban en mi mesa aunque no deberían; No están claros los límites de cada puesto; Hay tareas que nadie tiene claro de quién son; Se duplican esfuerzos y otras cosas quedan sin hacer; Hay roces entre el equipo por no saber quién hace qué; Sin mí las cosas se atascan"}, {"specialty_id": "CIRUGIA DE MARCA", "explanation": "Hay marcas que existen pero no destacan Identidades que no reflejan el verdadero valor de la empresa Aqui intervenimos la marca con precision quirurgica para elevar posicionamiento coherencia y percepcion", "lema": "La diferenciación es el éxito de tu negocio. Si no, te compran por precio.", "orden": 51, "symptom_id": "CIR-S1", "department": "Marca", "symptom_name": "Déficit de Imagen Competitiva", "logica": "Tu empresa vale más de lo que parece — el problema es que tu marca todavía no lo transmite.", "plan": "PIE", "description_symptom": "Si lo que proyecta tu marca no refleja lo que realmente eres capaz de hacer, estás perdiendo clientes antes de la primera conversación. La identidad débil no es un problema estético — es un problema de valor perdido.", "kpi_question": "Introduce cuántos de tus materiales de imagen están actualizados y tienen un aspecto profesional — carta de precios, catálogo, tarjetas, web, redes — y el total que tienes en uso. Si menos del 80% está al nivel, tu imagen está trabajando en tu contra antes de que el cliente te conozca.", "kpi_impact": "Cuando el 80% o más de tus materiales de imagen son coherentes y profesionales, la primera impresión genera confianza en lugar de dudas.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": ">80%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Materiales de imagen actualizados y con aspecto profesional (carta, catálogo, tarjetas, web, redes)"}, {"id": "inputB", "label": "Total materiales de imagen que tienes en uso"}], "input_a": "Materiales de imagen actualizados y profesionales", "input_b": "Total materiales de imagen en uso", "input_revised_1": "Materiales actualizados (post)", "input_revised_2": "Total materiales (post)", "result_revised": "Δ imagen profesional", "impact_treatment": "Reconstruimos la imagen de tu negocio para que transmita el nivel que merece. La primera impresión empieza a abrir puertas en lugar de generar dudas.", "optimizer_impact": "Incremento inmediato de confianza y valor percibido en el primer contacto con el cliente.", "optimizer_decision": "Diagnóstico de Identidad Competitiva", "example": "Estudio creativo identidad alineada 28 por ciento Tras protocolo sube a 79 por ciento", "capa_1_priorizacion": "Identidad debil narrativa difusa incoherencia visual estilo generico baja percepcion de valor primera impresion pobre falta de guia de identidad", "justi_capa1": e Tiempo del Equipo", "example": "Clinica dental onboarding 57 dias Tras protocolo baja a 21 dias", "capa_1_priorizacion": "Onboarding lento nuevos tardan en rendir proceso confuso experiencia inicial inconsistente tareas duplicadas falta de estandar curva de aprendizaje larga", "justi_capa1": "Tu onboarding es lento necesitas medir tiempo hasta productividad", "capa_2_decision": "Impacto vs Esfuerzo", "capa_2_options": "Medir el porcentaje de tiempo que cada persona clave dedica a tareas por debajo de su nivel; Calcular el coste real de tener a tu perfil más caro haciendo tareas que podría hacer alguien con la mitad de su salario; Identificar qué capacidades tiene el equipo hoy que, si el negocio las aprovechara, cambiarían resultados en los próximos 6 meses; Reasignar las tareas de bajo valor a las personas con menor coste por hora; Liberar tiempo de los mejores eliminando o delegando tareas que no necesitan su nivel; Definir para cada persona de alto potencial un reto concreto que estire sus capacidades y mida su impacto real en el negocio", "justi_capa2": "Porque necesitas priorizar mejoras criticas", "capa_3_comprension": "Mapa de competencias vs tareas reales", "justi_capa3": "Porque necesitas ver exactamente qué hace cada persona vs qué podría estar haciendo con su nivel real.", "capa_4_cambio": "Rediseño de asignaciones", "justi_capa4": "Porque necesitas mover a cada persona al trabajo donde su nivel genera más valor.", "capa_5_ejecucion": "Checklist de revisión de roles y tareas", "justi_capa5": "Porque necesitas confirmar que las reasignaciones se ejecutaron y el tiempo liberado se usa bien.", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir reduccion del tiempo de productividad", "capa_1_options": "Pago talento que no estoy aprovechando; Mi equipo pasa el día en tareas de bajo impacto; La gente sabe y puede más de lo que les pido; Tengo gente buena haciendo cosas que no aportan; Desaprovecho capacidades que ya tengo en casa; Los nuevos tardan demasiado en rendir de verdad"}, {"specialty_id": "RESCATE DE PERSONAS", "explanation": "No estas perdiendo talento Lo estas dejando escapar cada dia sin verlo Personas clave mal ubicadas desgaste silencioso y riesgo real de fuga Aqui intervenimos antes de que eso ocurra diagnostico individual alineacion persona rol con analisis conductual DISC y retencion del talento critico", "lema": "El talento permanece en negocios de éxito.", "orden": 73, "symptom_id": "RES-S3", "department": "Personas", "symptom_name": "Inflamación Interna", "logica": "Hay tensiones silenciosas que contaminan el ambiente cada día — y lo que no se nombra no se puede resolver.", "plan": "PIE", "description_symptom": "Si en tu equipo hay fricciones que todo el mundo nota pero nadie menciona, el problema no es la fricción — es el silencio. Las tensiones no resueltas no desaparecen: se acumulan, se agrandan y eventualmente explotan cuando menos lo esperas o cuando más te cuesta.", "kpi_question": "Introduce cuántas tensiones o conflictos internos identificas en tu equipo este mes y cuántos de ellos llegaron a una resolución o acuerdo claro. Si menos del 60% se resuelven de forma explícita, el resto se convierte en tensión silenciosa acumulada.", "kpi_impact": "Cuando más del 60% de las tensiones se resuelven de forma explícita, el ambiente mejora y la contaminación silenciosa desaparece.", "kpi_formula": "(InputB/InputA)*100", "kpi_objective": ">60%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Conflictos o tensiones dentro del equipo identificados este mes"}, {"id": "inputB", "label": "De esos, conflictos que llegaron a una resolución o acuerdo explícito"}], "input_a": "Tensiones identificadas este mes", "input_b": "Conflictos resueltos explícitamente", "input_revised_1": "Tareas dependientes post", "input_revised_2": "Tareas criticas totales post", "result_revised": "Δ dependencia", "impact_treatment": "Nombramos y resolvemos las tensiones que envenenan el ambiente sin que nadie lo diga en alto. El conflicto deja de contaminar en silencio y el equipo vuelve a colaborar sin fricciones.", "optimizer_impact": "Reducción inmediata de contaminación silenciosa al establecer un sistema de resolución explícita de conflictos.", "optimizer_decision": "Diagnóstico de Tensiones No Resueltas", "example": "Empresa de mantenimiento 47 por ciento dependencia Tras protocolo baja a 18 por ciento", "capa_1_priorizacion": "Dependencia de una persona riesgo operativo alto falta de backup carga mal distribuida conocimiento concentrado falta de documentacion parones potenciales", "justi_capa1": "Tu empresa depende demasiado de una persona necesitas medir riesgo", "capa_2_decision": "Árbol de Decisiones", "capa_2_options": "¿Cuantificar el coste mensual del conflicto en productividad perdida, errores y ausencias antes de decidir si actuar?; ¿Separar a dos personas que generan fricción aunque complique la operativa?; ¿Prescindir de quien genera mal ambiente aunque sea técnicamente bueno?; ¿Documentar el conocimiento crítico aunque la persona clave se sienta amenazada?; ¿Intervenir con ayuda externa o gestionar el clima internamente?; ¿Hacer una reunión abierta sobre el clima o hablar individualmente con cada persona?", "justi_capa2": "Porque necesitas evaluar escenarios", "capa_3_comprension": "Mapa de clima y fricciones", "justi_capa3": "Porque necesitas ver exactamente dónde se concentran las tensiones y qué las alimenta.", "capa_4_cambio": "Plan de resolución de conflicto", "justi_capa4": "Porque necesitas intervenir con criterio antes de que el conflicto cueste más de lo que cuesta resolverlo.", "capa_5_ejecucion": "Checklist de seguimiento de clima", "justi_capa5": "Porque necesitas confirmar que las tensiones bajan y el equipo recupera rendimiento.", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir reduccion de dependencia", "capa_1_options": "Hay tensiones que todos notan pero nadie menciona; El mal ambiente contamina el día a día; Demasiadas cosas dependen de una sola persona; Si esa persona falta nos paramos; No tenemos backup ni el conocimiento documentado; Las tensiones se acumulan hasta que explotan"}, {"specialty_id": "TERAPIA DE EXPERIENCIA", "explanation": "Cada interaccion construye o destruye tu reputacion Procesos que no transmiten valor friccion innecesaria y experiencias olvidables Aqui intervenimos para transformar la experiencia en una ventaja competitiva real", "lema": "Clientes que vuelven, te recomiendan.", "orden": 81, "symptom_id": "TER-S1", "department": "Experiencia", "symptom_name": "Efecto NO-WOW", "logica": "La experiencia que vive tu cliente depende del día o de quién le atiende — y esa variabilidad destruye la reputación que tardaste años en construir.", "plan": "PIE", "description_symptom": "Si la experiencia que recibe tu cliente cambia según el turno, la persona o el día de la semana, no tienes un estándar de servicio — tienes improvisación. Y cada experiencia por debajo del nivel borra el esfuerzo de diez que salieron bien.", "kpi_question": "Introduce cuántas atenciones o servicios generaron una queja o incidencia este mes y el total de atenciones realizadas. Si más del 5% genera problemas, la experiencia que vive el cliente depende del día o de quién atiende — no de un estándar.", "kpi_impact": "Mantener las incidencias por debajo del 5% garantiza que el cliente recibe lo que espera independientemente del día o de quién le atiende.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": "<5%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Atenciones o servicios que generaron queja o incidencia este mes"}, {"id": "inputB", "label": "Total atenciones o servicios realizados este mes"}], "input_a": "Atenciones con queja o incidencia", "input_b": "Total atenciones del mes", "input_revised_1": "Atenciones con queja (post)", "input_revised_2": "Total atenciones (post)", "result_revised": "Δ tasa de incidencias", "impact_treatment": "Estandarizamos la experiencia del cliente para que sea excelente independientemente de quién atiende o qué día es. Tu reputación deja de depender del azar y pasa a ser un activo que se construye.", "optimizer_impact": "Reducción inmediata de fricción y variabilidad en los momentos clave del proceso de atención.", "optimizer_decision": "Diagnóstico de Consistencia de Experiencia", "example": "Centro estetica 52 por ciento consistencia Tras protocolo sube a 84 por ciento", "capa_1_priorizacion": "Experiencia variable pasos distintos segun canal falta de estandares micro momentos sin valor equipo improvisa cliente no sabe que esperar", "justi_capa1": "Tu experiencia es inconsistente necesitas medir coherencia", "capa_2_decision": "Regla 5/25", "capa_2_options": ["Ausencia de momentos diseñados intencionalmente para generar sorpresa positiva — el servicio es correcto, no memorable", "El servicio es percibido como competente pero intercambiable — ningún elemento lo hace difícil de olvidar", "Los touchpoints de mayor impacto emocional (inicio y cierre) no tienen un protocolo diferencial", "El equipo gestiona las interacciones de forma funcional pero sin lenguaje ni comportamiento de experiencia diferencial", "No hay ningún gesto de valor añadido que el cliente no haya pagado y no esperaba recibir", "Los clientes satisfechos no recomiendan porque no tienen ninguna historia que contar sobre la empresa"], "justi_capa2": "Porque necesitas identificar micro momentos clave", "capa_3_comprension": "Customer Journey Map", "justi_capa3": "Porque necesitas ver experiencia completa", "capa_4_cambio": "Kaizen de experiencia", "justi_capa4": "Porque necesitas mejorar puntos criticos", "capa_5_ejecucion": "Checklist de experiencia", "justi_capa5": "Porque necesitas asegurar consistencia", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir coherencia real", "capa_1_options": "La experiencia del cliente cambia según el día o quién atiende; No tenemos un estándar de servicio improvisamos; Un mal día borra el esfuerzo de diez que salieron bien; El cliente no sabe qué esperar cada vez que viene; Cuidamos unos momentos y descuidamos otros; Mi reputación se resiente por esa irregularidad"}, {"specialty_id": "TERAPIA DE EXPERIENCIA", "explanation": "Cada interaccion construye o destruye tu reputacion Procesos que no transmiten valor friccion innecesaria y experiencias olvidables Aqui intervenimos para transformar la experiencia en una ventaja competitiva real", "lema": "Clientes que vuelven, te recomiendan.", "orden": 82, "symptom_id": "TER-S2", "department": "Experiencia", "symptom_name": "Necrosis de Cliente", "logica": "Tienes clientes insatisfechos que se van sin decir nada — y cada uno destruye reputación en silencio mientras tú no lo ves.", "plan": "PIE", "description_symptom": "El cliente que se va sin quejarse es el más peligroso: no te da la oportunidad de mejorar, y sí le cuenta a otros por qué se fue. La necrosis de cliente no duele en el momento — duele meses después, cuando notas que la reputación se ha erosionado sin que hayas hecho nada visible para que ocurra.", "kpi_question": "Introduce cuántos clientes molestos o insatisfechos has detectado y cuántos de ellos has recuperado antes de que terminaran la relación. Si recuperas menos del 60%, cada cliente insatisfecho es un detractor en potencia que ya no puedes controlar.", "kpi_impact": "Recuperar más del 60% de los clientes molestos antes de que se vayan convierte una experiencia negativa en fidelización y elimina la propagación silenciosa de reputación negativa.", "kpi_formula": "(InputB/InputA)*100", "kpi_objective": ">60%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Clientes molestos o insatisfechos detectados este mes"}, {"id": "inputB", "label": "De esos, clientes que recuperaste antes de que se fueran"}], "input_a": "Clientes molestos detectados", "input_b": "Clientes recuperados", "input_revised_1": "Clientes molestos post", "input_revised_2": "Clientes recuperados post", "result_revised": "Δ recuperacion", "impact_treatment": "Activamos el sistema de detección temprana que identifica a los clientes que se están enfriando antes de que se vayan sin decir nada. Recuperar siempre es más barato que volver a captar.", "optimizer_impact": "Reducción inmediata de detractores al establecer un sistema de detección y recuperación en caliente.", "optimizer_decision": "Diagnóstico de Recuperación de Cliente", "example": "Centro estetica 18 por ciento recuperacion Tras protocolo sube a 67 por ciento", "capa_1_priorizacion": "Clientes molestos no detectados equipo no identifica senales cliente se desconecta experiencia se rompe reputacion cae no hay protocolo de recuperacion", "justi_capa1": "Tu negocio pierde clientes molestos necesitas medir recuperacion", "capa_2_decision": "Análisis de Riesgos", "capa_2_options": ["Riesgo de invisibilidad: el cliente lleva más de 45 días sin ningún contacto proactivo de la empresa", "Riesgo de sustitución: no existe ningún diferencial percibido que haga incómodo el cambio de proveedor", "Riesgo de insatisfacción silenciosa: el cliente no se queja pero tampoco recomienda — señal de desconexión progresiva", "Riesgo de dependencia personal: si el interlocutor principal del cliente cambia, la relación se rompe", "Riesgo de valor no demostrado: el cliente no puede articular qué resultados concretos ha obtenido", "Riesgo de oferta estática: en 12 meses no se ha propuesto al cliente ninguna evolución, novedad o expansión"], "justi_capa2": "Porque necesitas priorizar puntos de recuperacion", "capa_3_comprension": "Mapa de emociones", "justi_capa3": "Porque necesitas identificar senales de molestia", "capa_4_cambio": "Plan de reconducción", "justi_capa4": "Porque necesitas intervenir en caliente", "capa_5_ejecucion": "Checklist de recuperacion", "justi_capa5": "Porque necesitas asegurar pasos criticos", "capa_6_seguimiento": "OKR tracking", "justi_capa6": "Porque necesitas medir recuperacion real", "capa_1_options": "Tengo clientes que se van sin decir nada; No detectamos cuándo un cliente está molesto; No tenemos un protocolo para recuperar a un cliente dolido; El cliente insatisfecho habla mal de mí por ahí; La experiencia se rompe sin que yo lo vea; Pierdo reputación en silencio mes a mes"}, {"specialty_id": "TERAPIA DE EXPERIENCIA", "explanation": "Cada interaccion construye o destruye tu reputacion Procesos que no transmiten valor friccion innecesaria y experiencias olvidables Aqui intervenimos para transformar la experiencia en una ventaja competitiva real", "lema": "Clientes que vuelven, te recomiendan.", "orden": 83, "symptom_id": "TER-S3", "department": "Experiencia", "symptom_name": "Bajo Valor Percibido", "logica": "Tu cliente paga pero no siente que vale lo que cuesta — y ese gap impide que te recomienden.", "plan": "PIE", "description_symptom": "Si tus clientes pagan sin protestar pero tampoco te recomiendan activamente, el valor que entregas no está siendo percibido. No es lo mismo hacer bien el trabajo que hacer que el cliente sienta que ha sido una buena decisión. El gap entre valor real y valor percibido es donde se pierden las renovaciones y las referencias.", "kpi_question": "Introduce cuántos clientes nuevos llegaron este mes por recomendación de un cliente existente y el total de clientes nuevos. Si menos del 40% llega por recomendación, tus clientes no están prescribiendo tu negocio — y el valor que entregas no se está percibiendo lo suficiente.", "kpi_impact": "Cuando más del 40% de los nuevos clientes llegan por recomendación, el valor percibido es tan alto que tus propios clientes se convierten en tu mejor canal de captación.", "kpi_formula": "(InputA/InputB)*100", "kpi_objective": ">40%", "threshold_critical": 70, "threshold_recommended": 85, "threshold_optimizer": 95, "threshold_elite": 100, "inputs": [{"id": "inputA", "label": "Clientes nuevos que llegaron por recomendación de un cliente existente"}, {"id": "inputB", "label": "Total clientes nuevos este mes"}], "input_a": "Clientes nuevos por recomendación", "input_b": "Total clientes nuevos del mes", "input_revised_1": "Clientes por recomendación (post)", "input_revised_2": "Total clientes nuevos (post)", "result_revised": "Δ tasa de recomendación", "impact_treatment": "Diseñamos la experiencia para que tu cliente perciba exactamente el valor que le entregas. Cuando siente que vale lo que paga, te recomienda, vuelve y acepta el precio sin regatear.", "optimizer_impact": "Reducción inmediata de comparación por precio al hacer visible el valor en cada interacción.", "optimizer_decision": "Diagnóstico de Gap de Valor Percibido", "example": "Clinica dental 38 por ciento valor percibido Tras protocolo sube a 79 por ciento", "capa_1_priorizacion": "Cliente no entiende valor experiencia funcional no diferenciada narrativa debil estetica pobre momentos sin impacto precio no justificado", "justi_capa1": "Tu experiencia no transmite valor necesitas medir percepcion", "capa_2_decision": "DAFO de valor", "capa_2_options": ["El cliente no tiene referencia de con qué comparar — nadie estableció una línea base al inicio del servicio", "La fluidez en la entrega hace invisible el expertise — el cliente subestima lo que requiere hacerlo bien", "Las expectativas fueron gestionadas hacia arriba al vender y ahora el resultado correcto parece insuficiente", "El valor impacta en múltiples niveles de la organización del cliente pero solo se rinde cuentas a una sola persona", "La competencia con menor resultado pero mejor presentación está ganando la comparación de valor percibido", "El ciclo pago-percepción está invertido: el cliente paga antes de sentir el valor, nunca después"], "justi_capa2": "Porque nec       <strong style="color:#4caf50">Motor espera:</strong> ${esc(an.exp_j4||'—')}</div>
    <div class="pstep c4"><div class="psl">C4 — Cambio</div><div class="psn">${esc(s.capa_4_cambio||'—')}</div><div class="psd">${esc(s.justi_capa4||'')}</div></div>
    <div class="pstep c5"><div class="psl">C5 — Ejecución</div><div class="psn">${esc(s.capa_5_ejecucion||'—')}</div><div class="psd">${esc(s.justi_capa5||'')}</div></div>
    <div style="font-size:11px;color:#666;margin-top:8px">
      <strong style="color:#777">justi_capa6 actual:</strong> ${esc(s.justi_capa6||'—')}<br>
      <strong style="color:#4caf50">Motor espera:</strong> ${esc(an.exp_j6||'—')}</div>
  </div></div>`;
  h+=`<div class="verdict"><div class="vttl">Veredicto de consultoría</div>
    <div class="vq">¿Este síntoma es comercialmente viable (399–1.500€) y clínicamente coherente?</div>
    <div class="vbtns">
      <button id="vb-ok" class="vbtn${verd==='ok'?' v-ok':''}" onclick="saveVerdict('${sid}','ok')">✅ Aprobado</button>
      <button id="vb-warn" class="vbtn${verd==='warn'?' v-warn':''}" onclick="saveVerdict('${sid}','warn')">⚠️ Ajuste menor</button>
      <button id="vb-bad" class="vbtn${verd==='bad'?' v-bad':''}" onclick="saveVerdict('${sid}','bad')">🔴 Corrección necesaria</button>
    </div>
    <textarea class="vnote" id="vn-${sid}" placeholder="Notas..." oninput="saveVerdNote('${sid}')">${esc(note)}</textarea>
  </div>`;
  document.getElementById('sim').innerHTML=h;
  setTimeout(()=>updKpi(sid,s.kpi_formula,s.kpi_objective),40);
}
function renderDash(){
  document.getElementById('dash').innerHTML=S.map((s,i)=>{
    const an=AN[s.symptom_id]||{};const sc=an.score??100;const v=verdicts[s.symptom_id]||'';
    const cls=v?('ok warn err'.split(' ')[['ok','warn','bad'].indexOf(v)]||''):sc>=85?'ok':sc>=60?'warn':'err';
    return `<div class="dot ${cls}" title="${esc(s.symptom_id)}: ${esc(s.symptom_name)} (${sc})" onclick="cur=${i};renderSym();updSel();updProg()"></div>`;
  }).join('');
}
function loadSym(id){cur=S.findIndex(s=>s.symptom_id===id);if(cur<0)cur=0;renderSym();updProg();window.scrollTo(0,0);}
function updSel(){document.getElementById('sel').value=S[cur].symptom_id;}
function updProg(){document.getElementById('prog').style.width=(((cur+1)/S.length)*100)+'%';}
function prev(){if(cur>0){cur--;renderSym();updSel();updProg();window.scrollTo(0,0);}}
function next(){if(cur<S.length-1){cur++;renderSym();updSel();updProg();window.scrollTo(0,0);}}
function exportJSON(){
  const out=JSON.parse(JSON.stringify(S));let count=0;
  out.forEach(s=>{const c=corrections[s.symptom_id];if(!c)return;
    Object.entries(c).forEach(([field,data])=>{
      if(data.accepted&&data.value){
        if(field==='C2→C3')s.capa_3_comprension=data.value;
        else if(field==='justi_capa2')s.justi_capa2=data.value;
        else if(field==='justi_capa3')s.justi_capa3=data.value;
        else if(field==='justi_capa4')s.justi_capa4=data.value;
        else if(field==='justi_capa6')s.justi_capa6=data.value;
        count++;
      }
    });
  });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='symptoms_corrected.json';a.click();
  alert(`Exportado con ${count} corrección${count!==1?'es':''} aplicada${count!==1?'s':''}.`);
}
function init(){
  const sel=document.getElementById('sel');
  S.forEach(s=>{const o=document.createElement('option');o.value=s.symptom_id;o.textContent=s.symptom_id+' — '+s.symptom_name;sel.appendChild(o);});
  renderDash();loadSym(S[0].symptom_id);
}
init();
</script>
</body></html>
