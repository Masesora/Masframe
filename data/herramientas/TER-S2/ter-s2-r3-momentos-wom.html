<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentos WOM — MASFRAME</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8f7ff; color: #1B2B4B; }
.header { background: #1B2B4B; color: white; padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
.logo { width: 44px; height: 44px; background: #C4A55A; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #1B2B4B; flex-shrink: 0; }
.header-text h1 { font-size: 18px; font-weight: 700; }
.header-text p { font-size: 13px; opacity: 0.75; margin-top: 2px; }
.badge { margin-left: auto; background: #C4A55A; color: #1B2B4B; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
.container { max-width: 1300px; margin: 0 auto; padding: 24px 16px; }
.section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(27,43,75,0.08); }
.section h2 { font-size: 15px; color: #1B2B4B; margin-bottom: 14px; border-left: 3px solid #C4A55A; padding-left: 10px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #1B2B4B; color: white; padding: 8px 10px; text-align: left; font-size: 12px; font-weight: 600; white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid #e8e8f0; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f0f0fa; }
input[type=text], input[type=number], input[type=date], select { border: 1px solid #d0d0e0; border-radius: 5px; padding: 4px 7px; font-size: 12px; font-family: inherit; background: white; }
input[type=text] { width: 180px; }
input[type=number] { width: 80px; }
input[type=date] { width: 120px; }
select { width: 160px; }
.btn-add { background: #1B2B4B; color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; }
.btn-add:hover { background: #2a3d63; }
.btn-print { background: #C4A55A; color: #1B2B4B; border: none; border-radius: 6px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; display: block; margin: 0 auto; }
.btn-print:hover { background: #b8963e; }
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.metric-card { background: #1B2B4B; color: white; border-radius: 10px; padding: 16px; text-align: center; }
.metric-card .value { font-size: 26px; font-weight: 800; color: #C4A55A; }
.metric-card .label { font-size: 12px; opacity: 0.8; margin-top: 4px; }
.badge-tipo { background: #1B2B4B; color: #C4A55A; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; border: 1px solid #C4A55A; }
@media print { .btn-add, .btn-print, .no-print { display: none !important; } body { background: white; } .section { box-shadow: none; border: 1px solid #ccc; } }
</style>
</head>
<body>
<div class="header">
  <div class="logo">M</div>
  <div class="header-text">
    <h1>Crecimiento Orgánico — Registro de Momentos WOM</h1>
    <p>TER · S2-R3 · Terapia de Experiencia de Cliente</p>
  </div>
  <div class="badge">HERRAMIENTA OPERATIVA</div>
</div>
<div class="container">
  <div class="section">
    <h2>Registro de Momentos Word of Mouth</h2>
    <div class="table-wrap">
    <table id="wom-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Momento / Interacción</th>
          <th>Tipo</th>
          <th>Cliente</th>
          <th>Reacción</th>
          <th>Alcance estimado (personas)</th>
          <th>Valor generado (€)</th>
        </tr>
      </thead>
      <tbody id="wom-body">
        <tr>
          <td><input type="date" value="2026-03-15"></td>
          <td><input type="text" value="Entrega de informe con análisis extra"></td>
          <td><select onchange="recalc()"><option selected>Entrega excepcional</option><option>Sorpresa</option><option>Problema bien resuelto</option><option>Personalización</option><option>Otro</option></select></td>
          <td><input type="text" value="Empresa Textil SL"></td>
          <td><select><option>Mencionó</option><option>Compartió</option><option selected>Refirió</option><option>Reseñó</option></select></td>
          <td><input type="number" value="5" min="0" onchange="recalc()"></td>
          <td><input type="number" value="1750" min="0" onchange="recalc()"></td>
        </tr>
        <tr>
          <td><input type="date" value="2026-04-08"></td>
          <td><input type="text" value="Felicitación aniversario empresa con detalle"></td>
          <td><select onchange="recalc()"><option>Entrega excepcional</option><option selected>Sorpresa</option><option>Problema bien resuelto</option><option>Personalización</option><option>Otro</option></select></td>
          <td><input type="text" value="Clínica Dental Sonrisa"></td>
          <td><select><option>Mencionó</option><option selected>Compartió</option><option>Refirió</option><option>Reseñó</option></select></td>
          <td><input type="number" value="200" min="0" onchange="recalc()"></td>
          <td><input type="number" value="0" min="0" onchange="recalc()"></td>
        </tr>
        <tr>
          <td><input type="date" value="2026-05-20"></td>
          <td><input type="text" value="Resolución urgente en 2h fuera de horario"></td>
          <td><select onchange="recalc()"><option>Entrega excepcional</option><option>Sorpresa</option><option selected>Problema bien resuelto</option><option>Personalización</option><option>Otro</option></select></td>
          <td><input type="text" value="Restaurante El Mirador"></td>
          <td><select><option>Mencionó</option><option>Compartió</option><option>Refirió</option><option selected>Reseñó</option></select></td>
          <td><input type="number" value="150" min="0" onchange="recalc()"></td>
          <td><input type="number" value="0" min="0" onchange="recalc()"></td>
        </tr>
        <tr>
          <td><input type="date" value="2026-06-10"></td>
          <td><input type="text" value="Propuesta personalizada con datos del sector"></td>
          <td><select onchange="recalc()"><option>Entrega excepcional</option><option>Sorpresa</option><option>Problema bien resuelto</option><option selected>Personalización</option><option>Otro</option></select></td>
          <td><input type="text" value="García e Hijos SL"></td>
          <td><select><option>Mencionó</option><option>Compartió</option><option selected>Refirió</option><option>Reseñó</option></select></td>
          <td><input type="number" value="3" min="0" onchange="recalc()"></td>
          <td><input type="number" value="1050" min="0" onchange="recalc()"></td>
        </tr>
      </tbody>
    </table>
    </div>
    <button class="btn-add no-print" onclick="addRow()">+ Añadir fila</button>
  </div>

  <div class="section">
    <h2>Métricas WOM</h2>
    <div class="metrics-grid" id="metricsGrid"></div>
  </div>

  <button class="btn-print no-print" onclick="window.print()">🖨 Imprimir / Exportar PDF</button>
</div>

<script>
function recalc() {
  const rows = document.querySelectorAll('#wom-body tr');
  let totalMomentos = rows.length;
  let totalValor = 0, totalAlcance = 0;
  const tipoCounts = {};

  rows.forEach(row => {
    const tipo = row.cells[2].querySelector('select').value;
    const alcance = parseInt(row.cells[5].querySelector('input').value) || 0;
    const valor = parseInt(row.cells[6].querySelector('input').value) || 0;
    totalAlcance += alcance;
    totalValor += valor;
    tipoCounts[tipo] = (tipoCounts[tipo] || 0) + 1;
  });

  const topTipo = Object.entries(tipoCounts).sort((a,b)=>b[1]-a[1])[0];
  const topTipoStr = topTipo ? topTipo[0] : '—';

  document.getElementById('metricsGrid').innerHTML = `
    <div class="metric-card"><div class="value">${totalMomentos}</div><div class="label">Total Momentos WOM</div></div>
    <div class="metric-card"><div class="value">${totalValor.toLocaleString('es-ES')}€</div><div class="label">Valor Total Generado</div></div>
    <div class="metric-card"><div class="value">${totalAlcance.toLocaleString('es-ES')}</div><div class="label">Alcance Total Estimado</div></div>
    <div class="metric-card"><div class="value" style="font-size:14px">${topTipoStr}</div><div class="label">Tipo más frecuente</div></div>
  `;
}

function addRow() {
  const tbody = document.getElementById('wom-body');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="date"></td>
    <td><input type="text" placeholder="Descripción del momento"></td>
    <td><select onchange="recalc()"><option>Entrega excepcional</option><option>Sorpresa</option><option>Problema bien resuelto</option><option>Personalización</option><option>Otro</option></select></td>
    <td><input type="text" placeholder="Cliente"></td>
    <td><select><option>Mencionó</option><option>Compartió</option><option>Refirió</option><option>Reseñó</option></select></td>
    <td><input type="number" value="0" min="0" onchange="recalc()"></td>
    <td><input type="number" value="0" min="0" onchange="recalc()"></td>
  `;
  tbody.appendChild(tr);
  recalc();
}

recalc();
</script>
</body>
</html>
